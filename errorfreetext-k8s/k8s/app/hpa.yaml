apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: errorfreetext-app-hpa
  namespace: errorfreetext
  labels:
    app: errorfreetext-app
    service: errorfreetext
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: errorfreetext-app
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    scaleUp:
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      stabilizationWindowSeconds: 0
      selectPolicy: Max
    scaleDown:
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      stabilizationWindowSeconds: 300
      selectPolicy: Min